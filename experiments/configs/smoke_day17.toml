# Smoke run: exercises the whole pipeline on one training file split by user buckets.
# Not a study result: train/V1/V2 come from the same day. Use experiments/configs/dev_day17_v18_v19.toml
# once train-18 and train-19 are available.
name = "smoke_day17"

[data]
root = "data/raw/mac/train"
mode = "smoke"
smoke_file = "train-17.parquet"
smoke_train_buckets = [0, 60]
smoke_v1_buckets = [60, 80]
smoke_v2_buckets = [80, 100]
smoke_user_pct = 25

[vocab]
min_count = 1

[groups]
# thresholds scale with the amount of training data; smoke uses 15% of one day
n_min = 75
c_min = 3
c_dense = 8

[models]
seeds = [2026, 2027, 2028]
lr_C = 1.0
lr_max_iter = 2000
num_boost_round = 2000
early_stopping_rounds = 50
ablation_no_history = true

[models.lgb]
learning_rate = 0.05
num_leaves = 63
min_data_in_leaf = 200
feature_fraction = 0.9
bagging_fraction = 0.9
bagging_freq = 1
num_threads = 8

[calibration]
lambdas = [1.0, 10.0, 100.0, 1000.0, 10000.0]

[bootstrap]
reps = 200
seed = 20261117

# pre-defined LightGBM candidates (compared on V2 with the first seed); "default" keeps LightGBM's
# categorical defaults (cat_smooth 10, min_data_per_group 100, max_cat_threshold 32, cat_l2 10)
[[models.lgb_candidates]]
name = "default"

[[models.lgb_candidates]]
name = "smooth50"
cat_smooth = 50.0
min_data_per_group = 200

[[models.lgb_candidates]]
name = "smooth50_thr64"
cat_smooth = 50.0
min_data_per_group = 200
max_cat_threshold = 64

[[models.lgb_candidates]]
name = "smooth100_l2"
cat_smooth = 100.0
min_data_per_group = 500
cat_l2 = 50.0

# M3: lightweight neural model referencing MAC BASE (settings fixed before any V2 result,
# from the feasibility probe experiments/scripts/m3_probe.py)
[models.m3]
enabled = true
variants = ["attn", "mean"]
dim = 16
epochs = 1
batch = 4096
lr = 0.001
id_min_count = 2
device = "cpu"
threads = 8
