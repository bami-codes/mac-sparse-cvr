# Study C development run (docs/DESIGN.md §16): train-08..10 for training, train-11 as V1 (calibration fit),
# train-12 as V2 (selection of NN settings, lambdas and the single interpretation candidate).
# The test files (train-13, train-14) are never listed here.
# Domain classes: training clicks only (share < 1% and >= 3,000 clicks = small), fixed in §16.3 before any run.
# LightGBM: the first study's chosen candidate `smooth50` (docs/DESIGN.md §10.8), unchanged.
name = "c_dev_train08_10"

[data]
root = "data/raw/mac/train"
mode = "files"
train = ["train-08.parquet", "train-09.parquet", "train-10.parquet"]
v1 = ["train-11.parquet"]
v2 = ["train-12.parquet"]

[vocab]
min_count = 1

[domains]
small_share = 0.01
small_min_clicks = 3000

[groups]
n_min = 500
c_min = 20
c_dense = 50

[models]
seeds = [2026, 2027, 2028]
num_boost_round = 2000
early_stopping_rounds = 50

[models.lgb]
learning_rate = 0.05
num_leaves = 63
min_data_in_leaf = 200
feature_fraction = 0.9
bagging_fraction = 0.9
bagging_freq = 1
num_threads = 8
cat_smooth = 50.0
min_data_per_group = 200

[models.nn]
lrs = [0.001, 0.003]
epochs = [1, 2]
dim = 16
batch = 4096
threads = 8

[calibration]
lambdas = [1.0, 10.0, 100.0, 1000.0, 10000.0]

[bootstrap]
reps = 1000
seed = 20261118
