# Smoke run: exercises the whole pipeline on ONE training file split by user buckets.
# Not a study result: train/V1/V2 come from the same day. Use configs/dev_day17_v18_v19.toml
# once train-18 and train-19 are available.
name = "smoke_day17"

[data]
root = "data/raw/mac/train"
mode = "smoke"
smoke_file = "train-17.parquet"
smoke_train_buckets = [0, 60]
smoke_v1_buckets = [60, 80]
smoke_v2_buckets = [80, 100]
smoke_user_pct = 25

[vocab]
min_count = 1

[groups]
# thresholds scale with the amount of training data; smoke uses 15% of one day
n_min = 75
c_min = 3
c_dense = 8

[models]
seeds = [2026, 2027, 2028]
lr_C = 1.0
lr_max_iter = 2000
num_boost_round = 2000
early_stopping_rounds = 50
ablation_no_history = true

[models.lgb]
learning_rate = 0.05
num_leaves = 63
min_data_in_leaf = 200
feature_fraction = 0.9
bagging_fraction = 0.9
bagging_freq = 1
num_threads = 8

[calibration]
lambdas = [1.0, 10.0, 100.0, 1000.0, 10000.0]

[bootstrap]
reps = 200
seed = 20261117
