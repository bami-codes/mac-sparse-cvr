# Smoke run of the second study (docs/DESIGN.md §13) on ONE file split by users; not a study result.
name = "smoke_stacking"

[data]
root = "data/raw/mac/train"
mode = "smoke"
smoke_file = "train-17.parquet"
smoke_train_buckets = [0, 60]
smoke_v1_buckets = [60, 80]
smoke_v2_buckets = [80, 100]
smoke_user_pct = 25

[vocab]
min_count = 1

[groups]
n_min = 75
c_min = 3
c_dense = 8

[models]
seeds = [2026, 2027, 2028]
include_m1 = false
lr_C = 1.0
lr_max_iter = 2000
num_boost_round = 2000
early_stopping_rounds = 50

# LightGBM settings fixed from the first study (smooth50); no candidate search
[models.lgb]
learning_rate = 0.05
num_leaves = 63
min_data_in_leaf = 200
feature_fraction = 0.9
bagging_fraction = 0.9
bagging_freq = 1
num_threads = 8
cat_smooth = 50.0
min_data_per_group = 200

[models.stacking]
enabled = true
variants = ["M2aux", "M2te", "M2both"]
folds = 3
aux_seed = 2026

[selection]
mode = "model_variant"
candidates = ["M2aux", "M2te", "M2both"]
reference = "M2"

[calibration]
lambdas = [1.0, 10.0, 100.0, 1000.0, 10000.0]

[bootstrap]
reps = 200
seed = 20261117
