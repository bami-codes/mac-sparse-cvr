# Study C smoke run: ONE development file (train-08) split by user buckets, 10% of users, to exercise every step
# end to end. Not a research result. The small-domain click minimum is scaled down to the smoke size.
name = "c_smoke"

[data]
root = "data/raw/mac/train"
mode = "smoke"
smoke_file = "train-08.parquet"
smoke_train_buckets = [0, 60]
smoke_v1_buckets = [60, 80]
smoke_v2_buckets = [80, 100]
smoke_user_pct = 10

[vocab]
min_count = 1

[domains]
small_share = 0.01
small_min_clicks = 100

[groups]
n_min = 50
c_min = 2
c_dense = 5

[models]
seeds = [2026, 2027, 2028]
num_boost_round = 300
early_stopping_rounds = 20

[models.lgb]
learning_rate = 0.05
num_leaves = 63
min_data_in_leaf = 200
feature_fraction = 0.9
bagging_fraction = 0.9
bagging_freq = 1
num_threads = 8
cat_smooth = 50.0
min_data_per_group = 200

[models.nn]
lrs = [0.001, 0.003]
epochs = [1, 2]
dim = 16
batch = 4096
threads = 8

[calibration]
lambdas = [1.0, 10.0, 100.0, 1000.0, 10000.0]

[bootstrap]
reps = 100
seed = 20261118
