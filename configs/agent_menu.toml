# Experiment menu for the hypothesis agent (docs/DESIGN.md §14): models on discovery files,
# tools evaluated on confirmation files that no earlier analysis opened.
name = "agent_menu"
seed = 2026

[data]
root = "data/raw/mac/train"
discovery = ["train-08.parquet", "train-09.parquet"]
confirmation = ["train-10.parquet", "train-11.parquet"]

[groups]
n_min = 500
c_min = 20
c_dense = 50

# first-study LightGBM settings (smooth50)
[lgb]
learning_rate = 0.05
num_leaves = 63
min_data_in_leaf = 200
feature_fraction = 0.9
bagging_fraction = 0.9
bagging_freq = 1
num_threads = 8
cat_smooth = 50.0
min_data_per_group = 200
