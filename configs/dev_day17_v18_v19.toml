# Development run with the planned roles (docs/DESIGN.md §4): train-17 for training,
# train-18 as V1 (calibration fit), train-19 as V2 (selection). The test file is never listed.
# Group thresholds are provisional until the training range is fixed (§10.2 item 6).
name = "dev_day17_v18_v19"

[data]
root = "data/raw/mac/train"
mode = "files"
train = ["train-17.parquet"]
v1 = ["train-18.parquet"]
v2 = ["train-19.parquet"]

[vocab]
min_count = 1

[groups]
n_min = 500
c_min = 20
c_dense = 50

[models]
seeds = [2026, 2027, 2028]
lr_C = 1.0
lr_max_iter = 2000
num_boost_round = 2000
early_stopping_rounds = 50
ablation_no_history = true

[models.lgb]
learning_rate = 0.05
num_leaves = 63
min_data_in_leaf = 200
feature_fraction = 0.9
bagging_fraction = 0.9
bagging_freq = 1
num_threads = 8

[calibration]
lambdas = [1.0, 10.0, 100.0, 1000.0, 10000.0]

[bootstrap]
reps = 1000
seed = 20261117
