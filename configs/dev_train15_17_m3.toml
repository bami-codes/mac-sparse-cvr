# Main development run with M3: train-15..17 for training, train-18 as V1 (calibration fit),
# train-19 as V2 (selection).
# The test file is never listed.
# Group thresholds: absolute training evidence (>= 500 clicks, < 20 positives over the whole training range),
# fixed before looking at any V2 result; not scaled with the number of files.
name = "dev_train15_17_m3"

[data]
root = "data/raw/mac/train"
mode = "files"
train = ["train-15.parquet", "train-16.parquet", "train-17.parquet"]
v1 = ["train-18.parquet"]
v2 = ["train-19.parquet"]

[vocab]
min_count = 1

[groups]
n_min = 500
c_min = 20
c_dense = 50

[models]
seeds = [2026, 2027, 2028]
lr_C = 1.0
lr_max_iter = 2000
num_boost_round = 2000
early_stopping_rounds = 50
ablation_no_history = true

[models.lgb]
learning_rate = 0.05
num_leaves = 63
min_data_in_leaf = 200
feature_fraction = 0.9
bagging_fraction = 0.9
bagging_freq = 1
num_threads = 8

[calibration]
lambdas = [1.0, 10.0, 100.0, 1000.0, 10000.0]

[bootstrap]
reps = 1000
seed = 20261117

# pre-defined LightGBM candidates (compared on V2 with the first seed)
[[models.lgb_candidates]]
name = "default"

[[models.lgb_candidates]]
name = "smooth50"
cat_smooth = 50.0
min_data_per_group = 200

[[models.lgb_candidates]]
name = "smooth50_thr64"
cat_smooth = 50.0
min_data_per_group = 200
max_cat_threshold = 64

[[models.lgb_candidates]]
name = "smooth100_l2"
cat_smooth = 100.0
min_data_per_group = 500
cat_l2 = 50.0

# M3: lightweight neural model referencing MAC BASE. Settings fixed from the feasibility probe
# (scripts/m3_probe.py) before any V2 result; trained in a separate PyTorch-only process.
[models.m3]
enabled = true
variants = ["attn", "mean"]
dim = 16
epochs = 1
batch = 4096
lr = 0.001
id_min_count = 2
device = "cpu"
threads = 8
