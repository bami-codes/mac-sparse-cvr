[project]
name = "sparse-cvr"
version = "0.1.0"
description = "Sparse-group CVR prediction and conversion-signal analysis on the MAC benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "torch>=2.4",
    "pandas>=2.2,<3",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]  # runs/ may hold review snapshots with their own copies of the tests
markers = ["e2e: every command of both studies on synthetic files, a few minutes (uv run pytest -m e2e)"]
addopts = "-m 'not e2e'"
