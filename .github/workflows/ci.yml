name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Lint and format
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Install
        run: uv sync --frozen
      - name: Tests (synthetic data, no MAC download)
        run: uv run pytest -q
